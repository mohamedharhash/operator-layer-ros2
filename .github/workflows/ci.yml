name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------ 1. core (fast, no ROS)
  core:
    name: core · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e "core[dev]"
      - run: ruff check core
      - run: pytest core -q --cov=operator_layer_core --cov-report=term-missing
      - name: smoke the terminal demo
        run: python -m operator_layer_core.demo 40

  # ------------------------------------------------------------ 2. ROS 2 build + test
  # Runs on the plain Ubuntu runner and installs ROS 2 from apt. Running inside the
  # ros:* container images breaks actions/checkout on current Node 24 runners.
  ros2:
    name: ros2 · ${{ matrix.distro }}
    needs: core
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: humble
            os: ubuntu-22.04
          - distro: jazzy
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      ROS_DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: install ROS 2 ${{ matrix.distro }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl gnupg lsb-release software-properties-common
          sudo add-apt-repository -y universe
          sudo curl -fsSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] \
            http://packages.ros.org/ros2/ubuntu $(. /etc/os-release && echo $UBUNTU_CODENAME) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ros-${ROS_DISTRO}-ros-base \
            ros-${ROS_DISTRO}-launch-testing ros-${ROS_DISTRO}-launch-testing-ros \
            python3-colcon-common-extensions python3-pip python3-venv python3-pytest
      - name: install core
        run: |
          set -euo pipefail
          # A venv that can still see the apt-installed ROS python packages.
          # Its own pip is fresh, so PEP 621 metadata works on 22.04 and we
          # never touch Debian-owned packages on 24.04.
          python3 -m venv --system-site-packages "$HOME/olvenv"
          "$HOME/olvenv/bin/pip" install --upgrade pip setuptools wheel
          "$HOME/olvenv/bin/pip" install ./core
          "$HOME/olvenv/bin/python" -c "import operator_layer_core; print('core ok', operator_layer_core.__version__)"
          # Do NOT put the venv on PATH: colcon must run with the system python so
          # its pytest extension is found. Only expose the venv's site-packages.
          SITE=$("$HOME/olvenv/bin/python" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "PYTHONPATH=$SITE${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '$SITE'); import operator_layer_core; print('system python sees core')"
          /usr/bin/python3 -c "import pytest, colcon_core; print('system pytest', pytest.__version__)"
          # colcon invokes /usr/bin/python3 directly, so expose the venv's
          # site-packages to the system interpreter as well.
          SITE=$("$HOME/olvenv/bin/python" -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          echo "PYTHONPATH=$SITE${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"
          /usr/bin/python3 -c "import sys; sys.path.insert(0, '$SITE'); import operator_layer_core; print('system python sees core')"
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          cd ros2_ws && colcon build --event-handlers console_direct+
      - name: colcon test (unit + launch_testing integration)
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          cd ros2_ws && source install/setup.bash
          colcon test --event-handlers console_direct+ --return-code-on-test-failure --pytest-args -v
      - name: test summary
        if: always()
        shell: bash
        run: |
          cd ros2_ws && colcon test-result --verbose || true
          { echo '## colcon test-result'; echo '```'; colcon test-result --verbose 2>&1 | tail -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-test-results-${{ matrix.distro }}
          path: ros2_ws/build/*/test_results/
          if-no-files-found: ignore

  # ------------------------------------------------------------ 3. multi-arch image
  image:
    name: docker · amd64+arm64
    runs-on: ubuntu-latest
    needs: ros2
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:humble
          cache-from: type=gha
          cache-to: type=gha,mode=max
