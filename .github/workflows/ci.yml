name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------ 1. core (fast, no ROS)
  core:
    name: core · py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e "core[dev]"
      - run: ruff check core
      - run: pytest core -q --cov=operator_layer_core --cov-report=term-missing
      - name: smoke the terminal demo
        run: python -m operator_layer_core.demo 40

  # ------------------------------------------------------------ 2. ROS 2 build + test
  ros2:
    name: ros2 · ${{ matrix.distro }}
    runs-on: ubuntu-latest
    needs: core
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy]
    container:
      image: ros:${{ matrix.distro }}-ros-base
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-pip python3-colcon-common-extensions \
            ros-${{ matrix.distro }}-launch-testing ros-${{ matrix.distro }}-launch-testing-ros \
            ros-${{ matrix.distro }}-ament-flake8 ros-${{ matrix.distro }}-ament-pep257
          pip3 install --break-system-packages ./core || pip3 install ./core
      - name: colcon build
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          cd ros2_ws && colcon build --event-handlers console_direct+
      - name: colcon test (unit + launch_testing integration)
        shell: bash
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          cd ros2_ws && source install/setup.bash
          colcon test --event-handlers console_direct+ --return-code-on-test-failure
      - name: test summary
        if: always()
        shell: bash
        run: cd ros2_ws && colcon test-result --verbose || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-test-results-${{ matrix.distro }}
          path: ros2_ws/build/*/test_results/
          if-no-files-found: ignore

  # ------------------------------------------------------------ 3. multi-arch image
  image:
    name: docker · amd64+arm64
    runs-on: ubuntu-latest
    needs: ros2
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:humble
          cache-from: type=gha
          cache-to: type=gha,mode=max
